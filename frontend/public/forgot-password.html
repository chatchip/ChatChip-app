<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Sıfırlama - ChatChip</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .reset-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
        }
        .reset-container h2 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.5rem;
            color: var(--text);
        }
        .reset-container p {
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text);
        }
        .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: var(--bg);
            color: var(--text);
            transition: border 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            display: none;
        }
        .message.success {
            display: block;
            background: #D5F5E3;
            color: #1E8449;
            border: 1px solid #82E0AA;
        }
        .message.error {
            display: block;
            background: #FADBD8;
            color: #922B21;
            border: 1px solid #F1948A;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: var(--text-light);
            font-size: 0.8rem;
            text-decoration: none;
        }
        .back-link:hover {
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <h2>🔑 Şifre Sıfırla</h2>
        <p>E-posta adresine şifre sıfırlama linki göndereceğiz.</p>

        <div id="message" class="message"></div>

        <form id="forgotForm">
            <div class="form-group">
                <label>E-posta Adresi</label>
                <input type="email" id="emailInput" class="form-input" placeholder="ornek@mail.com" required>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">📧 Link Gönder</button>
        </form>

        <a href="/index.html" class="back-link">← Giriş sayfasına dön</a>
    </div>

    <script src="/js/datamanager.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('emailInput').value.trim();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');
            
            if (!email) {
                showMessage('❌ E-posta adresinizi girin.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Gönderiliyor...';
            msg.style.display = 'none';

            try {
                const dm = window.DataManager;
                const result = await dm.forgotPassword(email);
                
                if (result.success) {
                    showMessage('✅ ' + result.message, 'success');
                    document.getElementById('emailInput').value = '';
                } else {
                    showMessage('❌ ' + (result.error || 'Bir hata oluştu.'), 'error');
                }
            } catch (error) {
                showMessage('❌ ' + error.message, 'error');
            }

            btn.disabled = false;
            btn.textContent = '📧 Link Gönder';
        });

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
        }
    </script>
</body>
</html>
