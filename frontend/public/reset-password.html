<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Şifre - ChatChip</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .reset-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
        }
        .reset-container h2 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.5rem;
            color: var(--text);
        }
        .reset-container p {
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text);
        }
        .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: var(--bg);
            color: var(--text);
            transition: border 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            display: none;
        }
        .message.success {
            display: block;
            background: #D5F5E3;
            color: #1E8449;
            border: 1px solid #82E0AA;
        }
        .message.error {
            display: block;
            background: #FADBD8;
            color: #922B21;
            border: 1px solid #F1948A;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: var(--text-light);
            font-size: 0.8rem;
            text-decoration: none;
        }
        .back-link:hover {
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <h2>🔐 Yeni Şifre Oluştur</h2>
        <p>Yeni şifrenizi girin.</p>

        <div id="message" class="message"></div>

        <form id="resetForm">
            <div class="form-group">
                <label>Yeni Şifre</label>
                <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required minlength="6">
            </div>
            <div class="form-group">
                <label>Şifre Tekrar</label>
                <input type="password" id="passwordConfirmInput" class="form-input" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">🔓 Şifreyi Sıfırla</button>
        </form>

        <a href="/index.html" class="back-link">← Giriş sayfasına dön</a>
    </div>

    <script src="/js/datamanager.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('message').textContent = '❌ Geçersiz veya eksik token!';
            document.getElementById('message').className = 'message error';
            document.getElementById('message').style.display = 'block';
            document.getElementById('resetForm').style.display = 'none';
        }

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const password = document.getElementById('passwordInput').value;
            const confirm = document.getElementById('passwordConfirmInput').value;
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');
            
            if (password.length < 6) {
                showMessage('❌ Şifre en az 6 karakter olmalı.', 'error');
                return;
            }

            if (password !== confirm) {
                showMessage('❌ Şifreler eşleşmiyor!', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ İşleniyor...';
            msg.style.display = 'none';

            try {
                const dm = window.DataManager;
                const result = await dm.resetPassword(token, password);
                
                if (result.success) {
                    showMessage('✅ ' + result.message + ' Yönlendiriliyorsunuz...', 'success');
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 2000);
                } else {
                    showMessage('❌ ' + (result.error || 'Bir hata oluştu.'), 'error');
                }
            } catch (error) {
                showMessage('❌ ' + error.message, 'error');
            }

            btn.disabled = false;
            btn.textContent = '🔓 Şifreyi Sıfırla';
        });

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
        }
    </script>
</body>
</html>
