<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Çalışanım | ChatChip</title><link rel="stylesheet" href="/css/style.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><style>
*{box-sizing:border-box}body{margin:0;background:var(--bg,#fff);color:var(--text,#111827);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.head{height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--border,#e5e7eb);background:var(--bg-secondary,#fff);position:sticky;top:0;z-index:5}.back{border:0;background:none;font-size:22px;color:inherit;cursor:pointer}.title{font-weight:750;font-size:15px}.wrap{width:min(900px,100%);margin:auto;padding:24px 18px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.top h1{font-size:24px;margin:0}.top p{font-size:13px;color:var(--text-light,#6b7280);margin:5px 0 0}.edit,.photo-btn{border:1px solid var(--border,#d1d5db);background:var(--bg-secondary,#fff);color:inherit;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 22px}.card{border:1px solid var(--border,#e5e7eb);background:var(--bg-secondary,#fff);border-radius:15px;padding:17px}.num{font-size:27px;font-weight:800}.label{font-size:12px;color:var(--text-light,#6b7280);margin-top:4px}.identity{border:1px solid var(--border,#e5e7eb);background:var(--bg-secondary,#fff);border-radius:15px;padding:15px;display:flex;align-items:center;gap:14px;margin-bottom:26px}.agent-avatar{width:72px;height:72px;border-radius:50%;background:#eef2ff;display:grid;place-items:center;font-size:31px;overflow:hidden;flex:0 0 auto}.agent-avatar img{width:100%;height:100%;object-fit:cover;display:block}.identity-copy{flex:1;min-width:0}.identity-copy b{display:block;font-size:14px}.identity-copy span{display:block;color:var(--text-light,#6b7280);font-size:12px;margin-top:4px}.photo-actions{display:flex;gap:7px;flex-wrap:wrap}.photo-btn.danger{color:#dc2626}.section-title{font-size:16px;margin:0 0 12px}.list{border:1px solid var(--border,#e5e7eb);border-radius:15px;overflow:hidden;background:var(--bg-secondary,#fff)}.row{padding:15px 16px;border-bottom:1px solid var(--border,#e5e7eb);cursor:pointer}.row:last-child{border-bottom:0}.row:hover{background:var(--bg,#f8fafc)}.meta{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--text-light,#6b7280)}.preview{font-size:14px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty,.loading{padding:30px;text-align:center;color:var(--text-light,#6b7280);font-size:13px}.messages{text-align:left;max-height:60vh;overflow:auto}.msg{padding:10px 12px;border-radius:12px;margin:8px 0;white-space:pre-wrap;line-height:1.45;font-size:13px}.msg.user{background:#eef2ff;margin-left:12%}.msg.assistant{background:#f3f4f6;margin-right:12%;color:#111827}.msg small{display:block;opacity:.55;margin-top:5px;font-size:10px}#avatarFile{display:none}@media(max-width:650px){.cards{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.num{font-size:23px}.identity{align-items:flex-start;flex-wrap:wrap}.identity-copy{min-width:160px}.photo-actions{width:100%}}
</style></head><body><header class="head"><button class="back" onclick="location.href='/'">‹</button><img src="/assets/logo.svg" width="25" height="25" alt="ChatChip"><span class="title">AI Çalışanım</span></header><main class="wrap"><div class="top"><div><h1 id="agentName">AI Çalışanım</h1><p id="agentRole">Genel Bakış</p></div><button class="edit" id="editBtn">✏️ Bilgileri Düzenle</button></div><div class="cards"><div class="card"><div class="num" id="visitors">—</div><div class="label">Toplam Ziyaretçi</div></div><div class="card"><div class="num" id="conversations">—</div><div class="label">Sohbet Sayısı</div></div><div class="card"><div class="num" id="messages">—</div><div class="label">Mesaj Sayısı</div></div><div class="card"><div class="num" id="today">—</div><div class="label">Bugünkü Sohbet</div></div></div><div class="identity"><div class="agent-avatar" id="avatarBox">🤖</div><div class="identity-copy"><b>Profil Fotoğrafı / Logo</b><span>JPG, PNG veya WebP • En fazla 5 MB. Otomatik olarak 512×512 WebP'ye küçültülür.</span></div><div class="photo-actions"><input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp"><button class="photo-btn" id="avatarBtn">📷 Fotoğraf / Logo Seç</button><button class="photo-btn danger" id="removeAvatar" hidden>Sil</button></div></div><h2 class="section-title">Son Konuşmalar</h2><div class="list" id="list"><div class="loading">İstatistikler yükleniyor...</div></div></main><script>
const API='https://api.thechatchip.com/api',API_ORIGIN='https://api.thechatchip.com';const params=new URLSearchParams(location.search);const id=params.get('id');const token=window.DataManager?.getToken?.()||localStorage.getItem('chatchip_token');const $=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function ago(d){const n=Date.now()-new Date(d).getTime(),m=Math.floor(n/60000);if(m<1)return'şimdi';if(m<60)return m+' dk önce';const h=Math.floor(m/60);if(h<24)return h+' sa önce';return Math.floor(h/24)+' gün önce'}function assetUrl(v){if(!v)return null;return v.startsWith('/')?API_ORIGIN+v:v}function setAvatar(url){const box=$('avatarBox'),u=assetUrl(url);box.innerHTML=u?`<img src="${esc(u)}" alt="AI çalışan profil görseli">`:'🤖';$('removeAvatar').hidden=!u}
if(!id||!token){location.href='/';}else load();$('editBtn').onclick=()=>location.href=`/ai-employee.html?id=${encodeURIComponent(id)}&mode=manage`;$('avatarBtn').onclick=()=>$('avatarFile').click();$('avatarFile').onchange=()=>uploadAvatar($('avatarFile').files?.[0]);$('removeAvatar').onclick=removeAvatar;
async function load(){try{const r=await fetch(`${API}/agents/${encodeURIComponent(id)}/analytics`,{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'İstatistikler alınamadı');$('agentName').textContent=d.agent?.name||'AI Çalışanım';$('agentRole').textContent=(d.agent?.role||'')+(d.agent?.slug?` • /l/${d.agent.slug}`:'');$('visitors').textContent=d.summary?.visitors??0;$('conversations').textContent=d.summary?.conversations??0;$('messages').textContent=d.summary?.messages??0;$('today').textContent=d.summary?.today_conversations??0;setAvatar(d.agent?.avatar_url);render(d.recentConversations||[])}catch(e){$('list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function uploadAvatar(file){if(!file)return;if(file.size>5*1024*1024){Swal.fire({icon:'warning',title:'Dosya çok büyük',text:'En fazla 5 MB görsel yükleyebilirsin.'});return}try{Swal.fire({title:'Görsel hazırlanıyor...',didOpen:()=>Swal.showLoading(),allowOutsideClick:false});const fd=new FormData();fd.append('avatar',file);const r=await fetch(`${API}/agents/${encodeURIComponent(id)}/avatar`,{method:'POST',headers:{Authorization:`Bearer ${token}`},body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||'Görsel yüklenemedi');setAvatar(d.avatar_url);Swal.fire({icon:'success',title:'Güncellendi',text:'Fotoğraf / logo AI çalışanında kullanılacak.',timer:1400,showConfirmButton:false})}catch(e){Swal.fire({icon:'error',title:'Yüklenemedi',text:e.message})}finally{$('avatarFile').value=''}}
async function removeAvatar(){const ok=await Swal.fire({icon:'question',title:'Görsel kaldırılsın mı?',showCancelButton:true,confirmButtonText:'Kaldır',cancelButtonText:'Vazgeç'});if(!ok.isConfirmed)return;try{const r=await fetch(`${API}/agents/${encodeURIComponent(id)}/avatar`,{method:'DELETE',headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Görsel silinemedi');setAvatar(null)}catch(e){Swal.fire({icon:'error',title:'Silinemedi',text:e.message})}}
function render(rows){if(!rows.length){$('list').innerHTML='<div class="empty">Henüz konuşma yok.</div>';return}$('list').innerHTML=rows.map(c=>`<div class="row" data-id="${c.id}"><div class="meta"><span>Anonim Ziyaretçi</span><span>${ago(c.updated_at)} • ${c.message_count} mesaj</span></div><div class="preview">${esc(c.preview||'Konuşmayı görüntüle')}</div></div>`).join('');document.querySelectorAll('.row').forEach(x=>x.onclick=()=>openConversation(x.dataset.id))}
async function openConversation(cid){try{Swal.fire({title:'Konuşma yükleniyor...',didOpen:()=>Swal.showLoading(),allowOutsideClick:false});const r=await fetch(`${API}/agents/${encodeURIComponent(id)}/conversations/${encodeURIComponent(cid)}`,{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Konuşma alınamadı');const html='<div class="messages">'+(d.messages||[]).map(m=>`<div class="msg ${m.role==='user'?'user':'assistant'}"><b>${m.role==='user'?'Ziyaretçi':'AI Çalışanı'}</b><br>${esc(m.content)}<small>${new Date(m.created_at).toLocaleString('tr-TR')}</small></div>`).join('')+'</div>';Swal.fire({title:'Konuşma',html,width:650,confirmButtonText:'Kapat'})}catch(e){Swal.fire({icon:'error',title:'Açılamadı',text:e.message})}}
</script></body></html>
