<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Çalışanlarım | ChatChip</title>
<link rel="stylesheet" href="/css/style.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>*{box-sizing:border-box}html,body{width:100%!important;max-width:100%!important;margin:0!important;padding:0!important;overflow-x:hidden!important}body{display:block!important;position:static!important;min-width:0!important;background:var(--bg,#fff);color:var(--text,#111827);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.head{height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--border,#e5e7eb);background:var(--bg-secondary,#fff);position:sticky;top:0;z-index:5}.back{border:0;background:none;font-size:22px;color:inherit;cursor:pointer}.title{font-size:15px;font-weight:750}.wrap{display:block!important;position:relative!important;left:auto!important;right:auto!important;top:auto!important;transform:none!important;float:none!important;width:min(900px,100%)!important;max-width:100%!important;min-width:0!important;margin:0 auto!important;padding:26px 18px 70px!important}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.hero h1{font-size:25px;margin:0 0 6px}.muted{font-size:13px;color:var(--text-light,#6b7280)}.capacity{white-space:nowrap;border:1px solid var(--border,#e5e7eb);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.agent,.add{border:1px solid var(--border,#e5e7eb);background:var(--bg-secondary,#fff);border-radius:16px;padding:18px;min-height:175px}.agent{cursor:pointer;transition:.15s}.agent:hover{transform:translateY(-2px);border-color:var(--primary,#6366f1)}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#eef2ff;font-size:22px;margin-bottom:14px}.name{font-size:17px;font-weight:800}.role{font-size:12px;color:var(--text-light,#6b7280);margin-top:4px}.business{font-size:12px;margin-top:14px}.slug{font-size:11px;color:var(--text-light,#6b7280);margin-top:5px;overflow-wrap:anywhere}.agent-actions{display:flex;justify-content:flex-end;margin-top:14px}.delete{border:0;background:transparent;color:#dc2626;font-size:11px;font-weight:750;cursor:pointer;padding:6px 0}.add{display:grid;place-items:center;text-align:center;cursor:pointer;border-style:dashed}.add b{display:block;font-size:15px;margin-top:8px}.add.disabled{opacity:.5;cursor:not-allowed}.empty{grid-column:1/-1;padding:35px;text-align:center;color:var(--text-light,#6b7280)}@media(max-width:700px){html,body{width:100%!important;max-width:100vw!important;overflow-x:hidden!important}.head{width:100%!important;max-width:100vw!important;padding:0 13px!important}.wrap{width:100%!important;max-width:100vw!important;margin:0!important;padding:20px 13px 50px!important;overflow-x:hidden!important}.hero{align-items:flex-start}.grid{grid-template-columns:1fr}.agent,.add{min-height:145px}}</style></head>
<body><header class="head"><button class="back" onclick="location.href='/'">‹</button><img src="/assets/logo.svg" width="25"><span class="title">AI Çalışanlarım</span></header>
<main class="wrap"><div class="hero"><div><h1>AI Çalışanlarım</h1><div class="muted">Çalışanlarını ayrı ayrı yönet, QR noktalarını ve sonuçlarını takip et.</div></div><div class="capacity" id="capacity">— / 3 çalışan</div></div><div class="grid" id="agents"><div class="empty">Çalışanlar yükleniyor…</div></div></main>
<script>
const API='https://api.thechatchip.com/api',token=window.DataManager?.getToken?.()||localStorage.getItem('chatchip_token'),box=document.getElementById('agents'),cap=document.getElementById('capacity');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!token)location.href='/';
function normalize(d){if(Array.isArray(d))return{agents:d,limit:3};return{agents:Array.isArray(d.agents)?d.agents:(Array.isArray(d.items)?d.items:[]),limit:Number(d.limit||d.max_agents||3),remaining:d.remaining}}
function create(limit,count){if(count>=limit)return Swal.fire({icon:'info',title:'Çalışan limitine ulaştın',text:`Pro planında en fazla ${limit} AI çalışanı oluşturabilirsin.`});location.href='/ai-employee.html'}
async function removeAgent(id,name){const x=await Swal.fire({icon:'warning',title:'AI çalışanı silinsin mi?',html:`<b>${esc(name)}</b> ve bu çalışana bağlı bilgi, konuşma, CRM ve QR kayıtları kalıcı olarak silinecek.`,showCancelButton:true,confirmButtonText:'Kalıcı Sil',cancelButtonText:'İptal',confirmButtonColor:'#dc2626'});if(!x.isConfirmed)return;try{const r=await fetch(API+'/agents/'+encodeURIComponent(id),{method:'DELETE',headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)throw Error(d.error||'AI çalışan silinemedi');await Swal.fire({icon:'success',title:'AI çalışan silindi',timer:1200,showConfirmButton:false});load()}catch(e){Swal.fire({icon:'error',title:'Silinemedi',text:e.message}}}
async function load(){try{const r=await fetch(API+'/agents',{headers:{Authorization:'Bearer '+token},cache:'no-store'}),d=await r.json();if(r.status===403&&d.code==='PRO_PLAN_REQUIRED'){await Swal.fire({icon:'info',title:'AI Çalışan Pro özelliğidir'});location.href='/';return}if(!r.ok)throw Error(d.error||'Çalışanlar alınamadı');const x=normalize(d),count=x.agents.length,limit=x.limit||3;cap.textContent=`${count} / ${limit} çalışan`;const cards=x.agents.map(a=>`<div class="agent" data-id="${esc(a.id)}"><div class="avatar">👤</div><div class="name">${esc(a.name||a.employee_name||'AI Çalışanı')}</div><div class="role">${esc(a.role||a.employee_role||'')}</div><div class="business">${esc(a.business_name||a.businessName||'')}</div><div class="slug">${a.slug?'/l/'+esc(a.slug):''}</div><div class="agent-actions"><button class="delete" data-delete="${esc(a.id)}" data-name="${esc(a.name||a.employee_name||'AI Çalışanı')}">Sil</button></div></div>`).join('');const add=`<div class="add ${count>=limit?'disabled':''}" id="addAgent"><div><div style="font-size:30px">＋</div><b>Yeni AI Çalışanı</b><div class="muted">${count>=limit?'Pro planı limitine ulaştın':'Yeni bir çalışan oluştur'}</div></div></div>`;box.innerHTML=cards+add;box.querySelectorAll('.agent').forEach(el=>el.onclick=()=>location.href='/ai-employee-manage.html?id='+encodeURIComponent(el.dataset.id));box.querySelectorAll('[data-delete]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();removeAgent(btn.dataset.delete,btn.dataset.name)});document.getElementById('addAgent').onclick=()=>create(limit,count)}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>';Swal.fire({icon:'error',title:'Yüklenemedi',text:e.message})}}
load();
</script></body></html>
