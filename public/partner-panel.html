<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatChip - Bayi Paneli</title><link rel="stylesheet" href="/css/style.css"><style>body{background:#f7f8fa}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}.n{font-size:24px;font-weight:800}.muted{font-size:12px;color:#6b7280}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:12px}.badge{padding:3px 7px;border-radius:999px;background:#f3f4f6}.section{margin-top:16px}.install-action{width:100%;margin-top:18px;border:0;border-radius:18px;padding:17px 19px;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#2563eb 100%);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;cursor:pointer;box-shadow:0 10px 28px rgba(79,70,229,.22);transition:transform .18s ease,box-shadow .18s ease}.install-action:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(79,70,229,.30)}.install-action:active{transform:translateY(0)}.install-action-main{display:flex;align-items:center;gap:13px}.install-icon{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:21px;border:1px solid rgba(255,255,255,.22)}.install-title{font-size:15px;font-weight:800;letter-spacing:.1px}.install-desc{font-size:12px;opacity:.82;margin-top:3px;font-weight:500}.install-arrow{width:31px;height:31px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:18px}@media(max-width:600px){.install-action{padding:14px 15px;border-radius:15px}.install-desc{font-size:11px}.install-icon{width:40px;height:40px;flex-basis:40px}}</style></head><body><div class="wrap"><div class="top"><div><h2 style="margin:0">🤝 ChatChip Bayi Paneli</h2><div class="muted">Salt görüntüleme · atama ve değişiklikler merkez onayıyla yapılır.</div></div><a href="/backoffice.html" class="nav-btn">← Backoffice</a></div><button onclick="createInstallLink()" class="install-action"><span class="install-action-main"><span class="install-icon">⚡</span><span><span class="install-title">Yeni Kurulum</span><span class="install-desc">Müşterin için güvenli kurulum bağlantısı oluştur</span></span></span><span class="install-arrow">→</span></button><div id="installLinkBox"></div><div id="app" style="margin-top:16px">⏳ Yükleniyor...</div></div><script src="/js/datamanager.js"></script><script>
const API='https://chatchip-production.up.railway.app/api';
async function startPartnerSupport(userId,name){const token=localStorage.getItem('chatchip_token');try{const r=await fetch(API+'/partner/support-session/'+userId,{method:'POST',headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)throw Error(d.error||'Destek oturumu açılamadı');sessionStorage.setItem('chatchip_support_original_token',token);sessionStorage.setItem('chatchip_support_original_user',localStorage.getItem('chatchip_user')||'');sessionStorage.setItem('chatchip_support_type','partner');sessionStorage.setItem('chatchip_support_customer_name',name||'Müşteri');sessionStorage.setItem('chatchip_support_token',d.token);sessionStorage.setItem('chatchip_support_user',JSON.stringify(d.customer||{}));location.href='/ai-employees.html?support=1&support_type=partner'}catch(e){alert('❌ '+e.message)}}
async function createInstallLink(){const token=localStorage.getItem('chatchip_token');try{const r=await fetch(API+'/partner/install-links',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json();if(!r.ok)throw Error(d.error||'Bağlantı oluşturulamadı');let me={};try{me=JSON.parse(localStorage.getItem('chatchip_user')||'{}')}catch(_){}const refId=Number(me.id||me.user_id);if(!refId)throw Error('Bayi kullanıcı ID bulunamadı');const raw=String(d.url||'');const installToken=new URL(raw,location.origin).searchParams.get('partner_install');if(!installToken)throw Error('Kurulum tokenı alınamadı');const installUrl=location.origin+'/register.html?position=right&ref='+encodeURIComponent(refId)+'&partner_install='+encodeURIComponent(installToken);document.getElementById('installLinkBox').innerHTML='<div class="card section"><strong>Kurulum bağlantısı</strong><div class="muted">Müşteri mevcut kayıt sistemiyle sağ kola yerleşir; bayi kurulum kaynağı ayrıca korunur.</div><input value="'+esc(installUrl)+'" readonly style="width:100%;padding:9px;margin-top:8px;border:1px solid #ddd;border-radius:6px"><button id="copyInstallLink" style="margin-top:8px;padding:8px">Kopyala</button></div>';document.getElementById('copyInstallLink').onclick=async function(){await navigator.clipboard.writeText(installUrl);this.textContent='✓ Kopyalandı'}}catch(e){alert('❌ '+e.message)}};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function leadClass(x){const intent=String(x.lead_intent||'').toLowerCase(),score=Number(x.lead_score||0);if(intent==='purchase_intent')return {label:'🔥 Sıcak fırsat',tone:'#b91c1c',bg:'#fef2f2'};if(['business_offer','partnership'].includes(intent))return {label:'⭐ Önemli',tone:'#92400e',bg:'#fffbeb'};if(intent==='complaint')return {label:'⚠️ Şikayet',tone:'#9f1239',bg:'#fff1f2'};if(intent==='support')return {label:'🛠️ Destek',tone:'#1d4ed8',bg:'#eff6ff'};if(intent==='product_question')return {label:'ℹ️ Bilgi talebi',tone:'#475569',bg:'#f8fafc'};if(intent==='contact_shared')return {label:'📞 İletişim bıraktı',tone:'#047857',bg:'#ecfdf5'};if(score>=85)return {label:'📌 Önemli',tone:'#047857',bg:'#ecfdf5'};return {label:'Normal',tone:'#64748b',bg:'#f8fafc'}}
function crmLabel(v){return({new:'Yeni',contacted:'Görüşüldü',follow_up:'Tekrar Görüşülecek',won:'Satış / Kurulum',lost:'İptal / Kaybedildi'})[v]||'Yeni'}
function crmTone(v){return({new:'#2563eb',contacted:'#475569',follow_up:'#b45309',won:'#047857',lost:'#b91c1c'})[v]||'#2563eb'}
async function savePartnerCRM(id,status,note,followUpAt){const token=localStorage.getItem('chatchip_token');const body={};if(status!==undefined)body.status=status;if(note!==undefined)body.note=note;if(followUpAt!==undefined)body.followUpAt=followUpAt;const r=await fetch(API+'/partner/attributions/'+encodeURIComponent(id)+'/crm',{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Kaydedilemedi');location.reload()}
function openCrmEditor(x){const m=ensureLeadModal(),status=x.partner_crm_status||'new',follow=x.follow_up_at?new Date(x.follow_up_at).toISOString().slice(0,16):'';const html='<label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px">Durum</label><select id="partnerCrmStatus" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;margin-bottom:12px"><option value="new">Yeni</option><option value="contacted">Görüşüldü</option><option value="follow_up">Tekrar Görüşülecek</option><option value="won">Satış / Kurulum</option><option value="lost">İptal / Kaybedildi</option></select><label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px">Takip tarihi</label><input id="partnerFollowAt" type="datetime-local" value="'+esc(follow)+'" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;margin-bottom:12px"><label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px">Not</label><textarea id="partnerCrmNote" maxlength="2000" style="width:100%;min-height:110px;padding:10px;border:1px solid #d1d5db;border-radius:9px;resize:vertical" placeholder="Örn: Pazartesi tekrar ara.">'+esc(x.partner_note||'')+'</textarea><button id="partnerCrmSave" style="width:100%;margin-top:12px;padding:11px;border:0;border-radius:9px;background:#4f46e5;color:#fff;font-weight:800;cursor:pointer">Kaydet</button>';showLeadModal('Fırsatı Güncelle',html);document.getElementById('partnerCrmStatus').value=status;document.getElementById('partnerCrmSave').onclick=async()=>{const st=document.getElementById('partnerCrmStatus').value,n=document.getElementById('partnerCrmNote').value.trim(),fu=document.getElementById('partnerFollowAt').value;try{await savePartnerCRM(x.id,st,n,fu||null)}catch(e){showLeadModal('Kaydedilemedi','<div style="color:#b91c1c">'+esc(e.message)+'</div>')}}}

function ensureLeadModal(){let m=document.getElementById('partnerLeadModal');if(m)return m;m=document.createElement('div');m.id='partnerLeadModal';m.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999';m.innerHTML='<div style="width:min(720px,100%);max-height:86vh;background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(15,23,42,.28);overflow:hidden"><div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #e5e7eb"><strong id="partnerLeadModalTitle">Konuşma</strong><button id="partnerLeadModalClose" style="border:0;background:transparent;font-size:22px;cursor:pointer;color:#64748b">×</button></div><div id="partnerLeadModalBody" style="padding:16px;overflow:auto;max-height:calc(86vh - 58px)"></div></div>';document.body.appendChild(m);m.querySelector('#partnerLeadModalClose').onclick=()=>m.style.display='none';m.onclick=e=>{if(e.target===m)m.style.display='none'};return m}
function showLeadModal(title,html){const m=ensureLeadModal();m.querySelector('#partnerLeadModalTitle').textContent=title;m.querySelector('#partnerLeadModalBody').innerHTML=html;m.style.display='flex'}
async function openPartnerLead(id){showLeadModal('Konuşma','<div class="muted">Konuşma yükleniyor...</div>');try{const token=localStorage.getItem('chatchip_token');const r=await fetch(API+'/partner/attributions/'+encodeURIComponent(id)+'/conversation',{headers:{Authorization:'Bearer '+token},cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Konuşma alınamadı');const cls=leadClass({lead_intent:d.intent,lead_score:d.lead_score});const html='<div style="text-align:left;margin-bottom:10px"><span style="display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;color:'+cls.tone+';background:'+cls.bg+'">'+esc(cls.label)+'</span> <span style="font-size:12px;color:#64748b">Skor: '+Number(d.lead_score||0)+'/100</span></div><div style="text-align:left">'+(d.messages||[]).map(m=>'<div style="margin:8px 0;padding:10px 12px;border-radius:10px;background:'+(m.role==='user'?'#eef2ff':'#f8fafc')+'"><b>'+(m.role==='user'?'Ziyaretçi':'AI Çalışanı')+'</b><br>'+esc(m.content)+'</div>').join('')+'</div>';showLeadModal('Konuşma',html)}catch(e){showLeadModal('Konuşma açılamadı','<div style="color:#b91c1c">'+esc(e.message||'Konuşma alınamadı')+'</div>')}}
(async()=>{const token=localStorage.getItem('chatchip_token');if(!token){location.href='/index.html';return}try{const r=await fetch(API+'/partner/dashboard',{headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)throw Error(d.error||'Yetkiniz yok');const s=d.summary||{},p=d.partner||{};const customers=(d.customers||[]).map(x=>'<tr><td>'+esc(x.name)+'<br><span class="muted">'+esc(x.email)+'</span></td><td>'+esc(x.plan_type||'free')+'</td><td>'+(x.active?'🟢 Aktif':'⚪ Pasif')+'</td><td>'+new Date(x.assigned_at).toLocaleDateString('tr-TR')+'</td><td><button onclick="startPartnerSupport('+x.id+',\''+esc(x.name).replace(/&#39;/g,"\\'")+'\')" style="padding:6px 9px;border:1px solid #3b82f6;background:white;color:#2563eb;border-radius:6px;cursor:pointer">🛠️ Destek</button></td></tr>').join('')||'<tr><td colspan="5">Atanmış işletme yok.</td></tr>';const rows=(d.attributions||[]),activeFilter=(window.partnerCrmFilter||'all'),filtered=activeFilter==='all'?rows:rows.filter(x=>(x.partner_crm_status||'new')===activeFilter);window.partnerRows=rows;const attrs=filtered.map(x=>{const cls=leadClass(x),crm=x.partner_crm_status||'new';return '<tr><td>'+esc(x.lead_name||x.referred_name||'Aday')+'<br><span class="muted">'+esc(x.lead_phone||x.lead_email||x.referred_email||'')+'</span>'+(x.lead_message?'<br><span class="muted">'+esc(x.lead_message)+'</span>':'')+'</td><td><span style="display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;color:'+cls.tone+';background:'+cls.bg+'">'+esc(cls.label)+'</span><br><span class="muted">Skor '+Number(x.lead_score||0)+'/100</span></td><td>'+esc(x.source_type)+'</td><td>'+esc(x.source_business||'-')+'</td><td>'+esc(x.source_agent||'-')+'</td><td>'+esc(x.source_qr||x.source_qr_serial||'-')+'</td><td><span class="badge" style="color:'+crmTone(crm)+'">'+esc(crmLabel(crm))+'</span>'+(x.follow_up_at?'<br><span class="muted">Takip: '+new Date(x.follow_up_at).toLocaleString('tr-TR')+'</span>':'')+'<br>'+((x.lead_conversation_id||x.attribution_conversation_id)?'<button class="partner-lead-open" data-attribution-id="'+Number(x.id)+'" style="margin-top:6px;padding:5px 8px;border:1px solid #d1d5db;background:#fff;border-radius:6px;cursor:pointer">Konuşmayı Gör</button>':'')+' <button class="partner-crm-edit" data-attribution-id="'+Number(x.id)+'" style="margin-top:6px;padding:5px 8px;border:1px solid #d1d5db;background:#fff;border-radius:6px;cursor:pointer">Güncelle</button></td><td>'+new Date(x.created_at).toLocaleString('tr-TR')+'</td></tr>'}).join('')||'<tr><td colspan="8">Bu durumda fırsat bulunamadı.</td></tr>';document.getElementById('app').innerHTML='<div class="card"><strong>'+esc(p.name)+'</strong> <span class="badge">'+esc(p.partner_code)+'</span><div class="muted">Komisyon oranı: %'+Number(p.commission_rate||0).toFixed(1)+'</div></div><div class="grid"><div class="card"><div class="n">'+s.customers+'</div><div class="muted">İşletmelerim</div></div><div class="card"><div class="n">'+s.active_customers+'</div><div class="muted">Aktif İşletme</div></div><div class="card"><div class="n">'+s.attributions+'</div><div class="muted">QR / Link Kaynağı</div></div><div class="card"><div class="n">'+(s.leads||0)+'</div><div class="muted">Yeni Fırsat</div></div><div class="card"><div class="n">'+s.registered+'</div><div class="muted">Kayıt</div></div><div class="card"><div class="n">'+s.paid+'</div><div class="muted">Ücretli</div></div></div><div class="card section"><h3>🏢 İşletmelerim</h3><div class="table"><table><thead><tr><th>İşletme</th><th>Plan</th><th>Durum</th><th>Merkez Ataması</th><th>Destek</th></tr></thead><tbody>'+customers+'</tbody></table></div></div><div class="card section"><h3>🔗 QR / Link Kaynakları ve Fırsatlar</h3><div class="muted">İletişim bilgisi bırakan ziyaretçi, kaynak işletme / AI / QR bilgisiyle birlikte burada görünür.</div><div id="partnerCrmFilters" style="display:flex;gap:6px;flex-wrap:wrap;margin:12px 0"><button data-filter="all">Tümü</button><button data-filter="new">Yeni</button><button data-filter="contacted">Görüşüldü</button><button data-filter="follow_up">Tekrar Görüşülecek</button><button data-filter="won">Satış / Kurulum</button><button data-filter="lost">İptal</button></div><div class="table"><table><thead><tr><th>Gelen</th><th>Sınıflama</th><th>Kaynak</th><th>Kaynak İşletme</th><th>AI</th><th>QR</th><th>Durum</th><th>Tarih</th></tr></thead><tbody>'+attrs+'</tbody></table></div></div>'}catch(e){document.getElementById('app').innerHTML='<div class="card">❌ '+esc(e.message)+'<br><br><a href="/backoffice.html">Backoffice’e dön</a></div>'}})();document.addEventListener('click',e=>{const b=e.target.closest('.partner-lead-open');if(b){const aid=Number(b.dataset.attributionId);if(aid)openPartnerLead(aid);return}const ed=e.target.closest('.partner-crm-edit');if(ed){const aid=Number(ed.dataset.attributionId),x=(window.partnerRows||[]).find(r=>Number(r.id)===aid);if(x)openCrmEditor(x);return}const fb=e.target.closest('#partnerCrmFilters button[data-filter]');if(fb){window.partnerCrmFilter=fb.dataset.filter;location.reload()}});
</script></body></html>
