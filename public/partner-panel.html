<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatChip - Bayi Paneli</title><link rel="stylesheet" href="/css/style.css"><style>body{background:#f7f8fa}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}.n{font-size:24px;font-weight:800}.muted{font-size:12px;color:#6b7280}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:12px}.badge{padding:3px 7px;border-radius:999px;background:#f3f4f6}.section{margin-top:16px}.install-action{width:100%;margin-top:18px;border:0;border-radius:18px;padding:17px 19px;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#2563eb 100%);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;cursor:pointer;box-shadow:0 10px 28px rgba(79,70,229,.22);transition:transform .18s ease,box-shadow .18s ease}.install-action:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(79,70,229,.30)}.install-action:active{transform:translateY(0)}.install-action-main{display:flex;align-items:center;gap:13px}.install-icon{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:21px;border:1px solid rgba(255,255,255,.22)}.install-title{font-size:15px;font-weight:800;letter-spacing:.1px}.install-desc{font-size:12px;opacity:.82;margin-top:3px;font-weight:500}.install-arrow{width:31px;height:31px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:18px}@media(max-width:600px){.install-action{padding:14px 15px;border-radius:15px}.install-desc{font-size:11px}.install-icon{width:40px;height:40px;flex-basis:40px}}</style></head><body><div class="wrap"><div class="top"><div><h2 style="margin:0">🤝 ChatChip Bayi Paneli</h2><div class="muted">Salt görüntüleme · atama ve değişiklikler merkez onayıyla yapılır.</div></div><a href="/backoffice.html" class="nav-btn">← Backoffice</a></div><button onclick="createInstallLink()" class="install-action"><span class="install-action-main"><span class="install-icon">⚡</span><span><span class="install-title">Yeni Kurulum</span><span class="install-desc">Müşterin için güvenli kurulum bağlantısı oluştur</span></span></span><span class="install-arrow">→</span></button><div id="installLinkBox"></div><div id="app" style="margin-top:16px">⏳ Yükleniyor...</div></div><script src="/js/datamanager.js"></script><script>
const API='https://chatchip-production.up.railway.app/api';
async function startPartnerSupport(userId,name){const token=localStorage.getItem('chatchip_token');try{const r=await fetch(API+'/partner/support-session/'+userId,{method:'POST',headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)throw Error(d.error||'Destek oturumu açılamadı');sessionStorage.setItem('chatchip_support_original_token',token);sessionStorage.setItem('chatchip_support_original_user',localStorage.getItem('chatchip_user')||'');sessionStorage.setItem('chatchip_support_type','partner');sessionStorage.setItem('chatchip_support_customer_name',name||'Müşteri');sessionStorage.setItem('chatchip_support_token',d.token);sessionStorage.setItem('chatchip_support_user',JSON.stringify(d.customer||{}));location.href='/ai-employees.html?support=1&support_type=partner'}catch(e){alert('❌ '+e.message)}}
async function createInstallLink(){const token=localStorage.getItem('chatchip_token');try{const r=await fetch(API+'/partner/install-links',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json();if(!r.ok)throw Error(d.error||'Bağlantı oluşturulamadı');let me={};try{me=JSON.parse(localStorage.getItem('chatchip_user')||'{}')}catch(_){}const refId=Number(me.id||me.user_id);if(!refId)throw Error('Bayi kullanıcı ID bulunamadı');const raw=String(d.url||'');const installToken=new URL(raw,location.origin).searchParams.get('partner_install');if(!installToken)throw Error('Kurulum tokenı alınamadı');const installUrl=location.origin+'/register.html?position=right&ref='+encodeURIComponent(refId)+'&partner_install='+encodeURIComponent(installToken);document.getElementById('installLinkBox').innerHTML='<div class="card section"><strong>Kurulum bağlantısı</strong><div class="muted">Müşteri mevcut kayıt sistemiyle sağ kola yerleşir; bayi kurulum kaynağı ayrıca korunur.</div><input value="'+esc(installUrl)+'" readonly style="width:100%;padding:9px;margin-top:8px;border:1px solid #ddd;border-radius:6px"><button id="copyInstallLink" style="margin-top:8px;padding:8px">Kopyala</button></div>';document.getElementById('copyInstallLink').onclick=async function(){await navigator.clipboard.writeText(installUrl);this.textContent='✓ Kopyalandı'}}catch(e){alert('❌ '+e.message)}};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const token=localStorage.getItem('chatchip_token');if(!token){location.href='/index.html';return}try{const r=await fetch(API+'/partner/dashboard',{headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)throw Error(d.error||'Yetkiniz yok');const s=d.summary||{},p=d.partner||{};const customers=(d.customers||[]).map(x=>'<tr><td>'+esc(x.name)+'<br><span class="muted">'+esc(x.email)+'</span></td><td>'+esc(x.plan_type||'free')+'</td><td>'+(x.active?'🟢 Aktif':'⚪ Pasif')+'</td><td>'+new Date(x.assigned_at).toLocaleDateString('tr-TR')+'</td><td><button onclick="startPartnerSupport('+x.id+',\''+esc(x.name).replace(/&#39;/g,"\\'")+'\')" style="padding:6px 9px;border:1px solid #3b82f6;background:white;color:#2563eb;border-radius:6px;cursor:pointer">🛠️ Destek</button></td></tr>').join('')||'<tr><td colspan="5">Atanmış işletme yok.</td></tr>';const attrs=(d.attributions||[]).map(x=>'<tr><td>'+esc(x.lead_name||x.referred_name||'Aday')+'<br><span class="muted">'+esc(x.lead_phone||x.lead_email||x.referred_email||'')+'</span>'+(x.lead_message?'<br><span class="muted">'+esc(x.lead_message)+'</span>':'')+'</td><td>'+esc(x.source_type)+'</td><td>'+esc(x.source_business||'-')+'</td><td>'+esc(x.source_agent||'-')+'</td><td>'+esc(x.source_qr||x.source_qr_serial||'-')+'</td><td><span class="badge">'+esc(x.status)+'</span></td><td>'+new Date(x.created_at).toLocaleString('tr-TR')+'</td></tr>').join('')||'<tr><td colspan="7">Henüz QR / link kaynaklı kayıt yok.</td></tr>';document.getElementById('app').innerHTML='<div class="card"><strong>'+esc(p.name)+'</strong> <span class="badge">'+esc(p.partner_code)+'</span><div class="muted">Komisyon oranı: %'+Number(p.commission_rate||0).toFixed(1)+'</div></div><div class="grid"><div class="card"><div class="n">'+s.customers+'</div><div class="muted">İşletmelerim</div></div><div class="card"><div class="n">'+s.active_customers+'</div><div class="muted">Aktif İşletme</div></div><div class="card"><div class="n">'+s.attributions+'</div><div class="muted">QR / Link Kaynağı</div></div><div class="card"><div class="n">'+(s.leads||0)+'</div><div class="muted">Yeni Fırsat</div></div><div class="card"><div class="n">'+s.registered+'</div><div class="muted">Kayıt</div></div><div class="card"><div class="n">'+s.paid+'</div><div class="muted">Ücretli</div></div></div><div class="card section"><h3>🏢 İşletmelerim</h3><div class="table"><table><thead><tr><th>İşletme</th><th>Plan</th><th>Durum</th><th>Merkez Ataması</th><th>Destek</th></tr></thead><tbody>'+customers+'</tbody></table></div></div><div class="card section"><h3>🔗 QR / Link Kaynakları ve Fırsatlar</h3><div class="muted">İletişim bilgisi bırakan ziyaretçi, kaynak işletme / AI / QR bilgisiyle birlikte burada görünür.</div><div class="table"><table><thead><tr><th>Gelen</th><th>Kaynak</th><th>Kaynak İşletme</th><th>AI</th><th>QR</th><th>Durum</th><th>Tarih</th></tr></thead><tbody>'+attrs+'</tbody></table></div></div>'}catch(e){document.getElementById('app').innerHTML='<div class="card">❌ '+esc(e.message)+'<br><br><a href="/backoffice.html">Backoffice’e dön</a></div>'}})();
</script></body></html>
