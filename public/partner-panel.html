<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatChip - Bayi Paneli</title><link rel="stylesheet" href="/css/style.css"><style>body{background:#f7f8fa}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}.n{font-size:24px;font-weight:800}.muted{font-size:12px;color:#6b7280}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:12px}.badge{padding:3px 7px;border-radius:999px;background:#f3f4f6}.section{margin-top:16px}</style></head><body><div class="wrap"><div class="top"><div><h2 style="margin:0">🤝 ChatChip Bayi Paneli</h2><div class="muted">Salt görüntüleme · atama ve değişiklikler merkez onayıyla yapılır.</div></div><a href="/backoffice.html" class="nav-btn">← Backoffice</a></div><div style="margin-top:16px"><button onclick="createInstallLink()" class="nav-btn">➕ Yeni Kurulum Başlat</button></div><div id="installLinkBox"></div><div id="app" style="margin-top:16px">⏳ Yükleniyor...</div></div><script src="/js/datamanager.js"></script><script>
const API='https://chatchip-production.up.railway.app/api';
async function startPartnerSupport(userId,name){const token=localStorage.getItem('chatchip_token');try{const r=await fetch(API+'/partner/support-session/'+userId,{method:'POST',headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)throw Error(d.error||'Destek oturumu açılamadı');sessionStorage.setItem('chatchip_support_original_token',token);sessionStorage.setItem('chatchip_support_original_user',localStorage.getItem('chatchip_user')||'');sessionStorage.setItem('chatchip_support_type','partner');sessionStorage.setItem('chatchip_support_customer_name',name||'Müşteri');sessionStorage.setItem('chatchip_support_token',d.token);sessionStorage.setItem('chatchip_support_user',JSON.stringify(d.customer||{}));location.href='/ai-employees.html?support=1&support_type=partner'}catch(e){alert('❌ '+e.message)}}
async function createInstallLink(){const token=localStorage.getItem('chatchip_token');try{const r=await fetch(API+'/partner/install-links',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}),d=await r.json();if(!r.ok)throw Error(d.error||'Bağlantı oluşturulamadı');document.getElementById('installLinkBox').innerHTML='<div class="card section"><strong>Kurulum bağlantısı</strong><div class="muted">Bu linkten kayıt olan işletme merkez onayına düşer; otomatik müşteriniz olmaz.</div><input value="'+esc(String(d.url||'').replace('/register?','/register.html?'))+'" readonly style="width:100%;padding:9px;margin-top:8px;border:1px solid #ddd;border-radius:6px"><button onclick="navigator.clipboard.writeText(\''+String(d.url||'').replace('/register?','/register.html?')+'\');this.textContent=\'✓ Kopyalandı\'" style="margin-top:8px;padding:8px">Kopyala</button></div>'}catch(e){alert('❌ '+e.message)}};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const token=localStorage.getItem('chatchip_token');if(!token){location.href='/index.html';return}try{const r=await fetch(API+'/partner/dashboard',{headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)throw Error(d.error||'Yetkiniz yok');const s=d.summary||{},p=d.partner||{};const customers=(d.customers||[]).map(x=>'<tr><td>'+esc(x.name)+'<br><span class="muted">'+esc(x.email)+'</span></td><td>'+esc(x.plan_type||'free')+'</td><td>'+(x.active?'🟢 Aktif':'⚪ Pasif')+'</td><td>'+new Date(x.assigned_at).toLocaleDateString('tr-TR')+'</td><td><button onclick="startPartnerSupport('+x.id+',\''+esc(x.name).replace(/&#39;/g,"\\'")+'\')" style="padding:6px 9px;border:1px solid #3b82f6;background:white;color:#2563eb;border-radius:6px;cursor:pointer">🛠️ Destek</button></td></tr>').join('')||'<tr><td colspan="5">Atanmış işletme yok.</td></tr>';const attrs=(d.attributions||[]).map(x=>'<tr><td>'+esc(x.referred_name||'Aday')+'<br><span class="muted">'+esc(x.referred_email||'')+'</span></td><td>'+esc(x.source_type)+'</td><td>'+esc(x.source_business||'-')+'</td><td>'+esc(x.source_agent||'-')+'</td><td>'+esc(x.source_qr||x.source_qr_serial||'-')+'</td><td><span class="badge">'+esc(x.status)+'</span></td><td>'+new Date(x.created_at).toLocaleString('tr-TR')+'</td></tr>').join('')||'<tr><td colspan="7">Henüz QR / link kaynaklı kayıt yok.</td></tr>';document.getElementById('app').innerHTML='<div class="card"><strong>'+esc(p.name)+'</strong> <span class="badge">'+esc(p.partner_code)+'</span><div class="muted">Komisyon oranı: %'+Number(p.commission_rate||0).toFixed(1)+'</div></div><div class="grid"><div class="card"><div class="n">'+s.customers+'</div><div class="muted">İşletmelerim</div></div><div class="card"><div class="n">'+s.active_customers+'</div><div class="muted">Aktif İşletme</div></div><div class="card"><div class="n">'+s.attributions+'</div><div class="muted">QR / Link Kaynağı</div></div><div class="card"><div class="n">'+s.registered+'</div><div class="muted">Kayıt</div></div><div class="card"><div class="n">'+s.paid+'</div><div class="muted">Ücretli</div></div></div><div class="card section"><h3>🏢 İşletmelerim</h3><div class="table"><table><thead><tr><th>İşletme</th><th>Plan</th><th>Durum</th><th>Merkez Ataması</th><th>Destek</th></tr></thead><tbody>'+customers+'</tbody></table></div></div><div class="card section"><h3>🔗 QR / Link Kaynakları</h3><div class="muted">Hangi işletme, AI çalışanı ve QR/link üzerinden geldiği burada görünür.</div><div class="table"><table><thead><tr><th>Gelen</th><th>Kaynak</th><th>Kaynak İşletme</th><th>AI</th><th>QR</th><th>Durum</th><th>Tarih</th></tr></thead><tbody>'+attrs+'</tbody></table></div></div>'}catch(e){document.getElementById('app').innerHTML='<div class="card">❌ '+esc(e.message)+'<br><br><a href="/backoffice.html">Backoffice’e dön</a></div>'}})();
</script></body></html>
