<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Parametre Test</title>
</head>
<body>
    <h1>Parametre Test Sayfası</h1>
    <div id="result" style="font-size: 20px; margin-top: 20px; padding: 20px; background: #f0f0f0; border-radius: 8px;"></div>
    
    <script>
        // Sayfa yüklenir yüklenmez parametreleri göster
        var params = new URLSearchParams(window.location.search);
        var ref = params.get('ref');
        var pos = params.get('position');
        
        document.getElementById('result').innerHTML = 
            'window.location.search: <b>' + window.location.search + '</b><br>' +
            'ref: <b>' + ref + '</b><br>' +
            'position: <b>' + pos + '</b>';
    </script>
</body>
</html>
