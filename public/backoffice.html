<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatChip - Backoffice</title>
    <meta name="theme-color" content="#7BD3C9">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/backoffice.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">
                <img src="/assets/logo.svg" alt="ChatChip" width="32" height="32">
                <span>ChatChip</span>
            </div>
            <div class="header-actions">
                <a href="/index.html" class="nav-btn">💬 Sohbet</a>
                <a href="/cuzdan.html" class="nav-btn">💰 Cüzdan</a>
                <button class="btn-profile" id="profileBtn">👤</button>
            </div>
        </header>

        <main class="bo-content" id="boContent">
            <div class="loading">Yükleniyor...</div>
        </main>
    </div>

    <!-- 🔥 ÖNCE DataManager'ı yükle -->
    <script src="/js/datamanager.js"></script>
    
    <script>
        // 🔥 Giriş kontrolü - DataManager yüklendikten SONRA çalışsın
        (function checkAuth() {
            console.log('🔐 Backoffice - Auth kontrolü başladı');
            
            // DataManager'ın yüklendiğinden emin ol
            if (typeof window.DataManager === 'undefined') {
                console.error('❌ DataManager yüklenemedi!');
                setTimeout(checkAuth, 500);
                return;
            }
            
            const dm = window.DataManager;
            const token = dm.getToken();
            const user = dm.currentUser;
            
            console.log('🔐 Token:', token ? '✅ Var' : '❌ Yok');
            console.log('🔐 User:', user);
            
            if (!token || !user) {
                console.log('❌ Giriş yapılmamış, ana sayfaya yönlendiriliyor...');
                window.location.href = '/index.html';
                return;
            }
            
            console.log('✅ Giriş yapılmış, kullanıcı:', user.name);
            console.log('🆔 Kullanıcı ID:', user.id);
            
            // Profile butonunu güncelle
            const profileBtn = document.getElementById('profileBtn');
            if (profileBtn && user) {
                profileBtn.textContent = user.name?.charAt(0).toUpperCase() || '👤';
            }
        })();
    </script>
    
    <!-- 🔥 SONRA backoffice.js'yi yükle -->
    <script src="/js/backoffice.js"></script>
</body>
</html>
