<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Çalışanı | ChatChip</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#111827;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{min-height:100vh;display:flex;flex-direction:column}.top{height:58px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 18px;gap:10px}.brand{font-weight:800}.newchat{margin-left:auto;border:1px solid #e5e7eb;background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;font-size:12px}.shell{width:min(760px,100%);margin:auto;padding:24px 16px 120px;flex:1}.profile{text-align:center;margin-bottom:22px}.avatar{width:70px;height:70px;border-radius:50%;background:#eef2ff;display:grid;place-items:center;margin:auto;font-size:34px}.name{font-size:22px;font-weight:800;margin-top:10px}.role,.business{color:#6b7280;font-size:13px;margin-top:4px}.chat{display:flex;flex-direction:column;gap:10px}.msg{max-width:84%;padding:12px 14px;border-radius:16px;line-height:1.5;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.bot{align-self:flex-start;background:#fff;border:1px solid #e5e7eb;border-bottom-left-radius:5px}.user{align-self:flex-end;background:#6366f1;color:#fff;border-bottom-right-radius:5px}.typing{opacity:.65}.composer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e7eb;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}.composer-in{width:min(728px,100%);margin:auto;display:flex;gap:8px}.composer textarea{flex:1;resize:none;max-height:120px;min-height:44px;border:1px solid #d1d5db;border-radius:14px;padding:11px 12px;font:inherit;outline:none}.composer button{border:0;border-radius:14px;background:#6366f1;color:#fff;font-weight:750;padding:0 17px;cursor:pointer}.composer button:disabled{opacity:.5}.powered{text-align:center;color:#9ca3af;font-size:11px;margin-top:20px}.error{background:#fff1f2;border:1px solid #fecdd3;color:#be123c;padding:14px;border-radius:12px;text-align:center}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0}.actions a{font-size:12px;text-decoration:none;color:#4f46e5;background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:8px 11px}</style></head>
<body><div class="page"><header class="top"><span>✦</span><span class="brand">ChatChip</span><button class="newchat" id="newChat" hidden>Yeni sohbet</button></header><main class="shell"><div id="root"><div class="profile"><div class="avatar">🤖</div><div class="name">AI çalışan yükleniyor...</div></div></div></main><div class="composer" id="composer" hidden><div class="composer-in"><textarea id="input" maxlength="1200" rows="1" placeholder="Mesajını yaz..."></textarea><button id="send">Gönder</button></div></div></div>
<script>
const API='https://api.thechatchip.com/api/public/agents';
const root=document.getElementById('root'),composer=document.getElementById('composer'),input=document.getElementById('input'),send=document.getElementById('send'),newChat=document.getElementById('newChat');
let agent=null,busy=false,conversationId=null,visitorId=localStorage.getItem('chatchip_public_visitor_id')||null;
function getSlug(){const p=location.pathname.split('/').filter(Boolean);return p[0]==='l'&&p[1]?decodeURIComponent(p[1]):new URLSearchParams(location.search).get('slug')||''}
function convKey(){return `chatchip_public_conversation_${getSlug()}`}
function safeUrl(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}}
function add(text,who,extra=''){const d=document.createElement('div');d.className=`msg ${who} ${extra}`;d.textContent=text;document.getElementById('chat').appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'});return d}
function actionLinks(a){const out=[];const web=safeUrl(a.website);if(web)out.push(`<a href="${web}" target="_blank" rel="noopener">Web sitesi</a>`);const social=a.social_links||{};const ig=safeUrl(a.instagram||social.instagram);if(ig)out.push(`<a href="${ig}" target="_blank" rel="noopener">Instagram</a>`);if(a.contact){const clean=String(a.contact).replace(/[^+\d]/g,'');if(clean)out.push(`<a href="tel:${clean}">Ara</a>`)}return out.join('')}
async function restoreHistory(){conversationId=localStorage.getItem(convKey())||null;if(!conversationId||!visitorId)return false;try{const r=await fetch(`${API}/${encodeURIComponent(getSlug())}/conversations/${encodeURIComponent(conversationId)}/history?visitorId=${encodeURIComponent(visitorId)}`,{cache:'no-store'});if(!r.ok){if(r.status===404){localStorage.removeItem(convKey());conversationId=null}return false}const d=await r.json();if(!Array.isArray(d.messages)||!d.messages.length)return false;for(const m of d.messages)add(m.content,m.role==='user'?'user':'bot');return true}catch{return false}}
async function load(){const slug=getSlug();if(!slug){root.innerHTML='<div class="error">AI çalışan adresi bulunamadı.</div>';return}try{const r=await fetch(`${API}/${encodeURIComponent(slug)}`,{cache:'no-store'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'AI çalışan bulunamadı.');agent=d;document.title=`${d.name||'AI Çalışanı'} | ${d.business_name||'ChatChip'}`;root.innerHTML=`<div class="profile"><div class="avatar">🤖</div><div class="name"></div><div class="role"></div><div class="business"></div><div class="actions">${actionLinks(d)}</div></div><div class="chat" id="chat"></div><div class="powered">Powered by ChatChip</div>`;root.querySelector('.name').textContent=d.name||'AI Çalışanı';root.querySelector('.role').textContent=d.role||'';root.querySelector('.business').textContent=d.business_name||'';const restored=await restoreHistory();if(!restored)add(d.welcome_message||'Merhaba 👋 Size nasıl yardımcı olabilirim?','bot');composer.hidden=false;newChat.hidden=false}catch(e){root.innerHTML=`<div class="error">${String(e.message||'AI çalışan yüklenemedi.')}</div>`}}
async function chat(){const message=input.value.trim();if(!message||busy||!agent)return;busy=true;send.disabled=true;input.value='';add(message,'user');const wait=add('Yazıyor…','bot','typing');try{const payload={message};if(visitorId)payload.visitorId=visitorId;if(conversationId)payload.conversationId=conversationId;const r=await fetch(`${API}/${encodeURIComponent(getSlug())}/chat`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.error||`Mesaj gönderilemedi (${r.status}).`)}wait.textContent='';wait.classList.remove('typing');if(!r.body){wait.textContent='Yanıt akışı alınamadı.';return}const reader=r.body.getReader(),dec=new TextDecoder();let buf='',answer='';const processEvent=raw=>{if(!raw)return;try{const ev=JSON.parse(raw);if(ev.visitorId){visitorId=ev.visitorId;localStorage.setItem('chatchip_public_visitor_id',visitorId)}if(ev.conversationId){conversationId=ev.conversationId;localStorage.setItem(convKey(),conversationId)}if(typeof ev.chunk==='string'&&ev.chunk){answer+=ev.chunk;wait.textContent=answer}}catch{}};while(true){const {done,value}=await reader.read();buf+=dec.decode(value||new Uint8Array(),{stream:!done});const events=buf.split(/\r?\n\r?\n/);buf=events.pop()||'';for(const event of events)for(const line of event.split(/\r?\n/))if(line.startsWith('data:'))processEvent(line.slice(5).trim());if(done)break}if(buf.trim())for(const line of buf.split(/\r?\n/))if(line.startsWith('data:'))processEvent(line.slice(5).trim());if(!answer)wait.textContent='Yanıt alınamadı.'}catch(e){wait.classList.remove('typing');wait.textContent=e.message||'Bir hata oluştu.'}finally{busy=false;send.disabled=false;input.focus()}}
newChat.addEventListener('click',()=>{if(busy)return;conversationId=null;localStorage.removeItem(convKey());const chatEl=document.getElementById('chat');if(chatEl)chatEl.innerHTML='';add(agent?.welcome_message||'Merhaba 👋 Size nasıl yardımcı olabilirim?','bot');input.focus()});
send.addEventListener('click',chat);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chat()}});load();
</script></body></html>
