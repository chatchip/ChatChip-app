<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatChip</title>
    <meta name="theme-color" content="#7BD3C9">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="app-container">
        <!-- SOL MENÜ -->
        <div class="sidebar-left" id="sidebarLeft">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="/assets/logo.svg" alt="ChatChip" width="28" height="28">
                    <span>ChatChip</span>
                </div>
                <button class="close-sidebar" onclick="toggleSidebar('left')">✕</button>
            </div>
            <button class="new-chat-btn" onclick="startNewChat()">➕ Yeni Sohbet</button>
            <div class="chat-history" id="chatHistory">
                <div style="text-align:center; padding:20px; color:var(--text-light); font-size:0.8rem;">Henüz sohbet yok</div>
            </div>
            <div class="search-chat">
                <input type="text" id="searchChatInput" placeholder="🔍 Sohbetlerde ara..." oninput="searchChats()">
            </div>
            <div class="sidebar-footer">
                <button class="sidebar-btn" onclick="startNewChat()" style="background:var(--primary); color:white; border:none; width:100%; padding:10px; border-radius:8px; font-weight:600; cursor:pointer;">➕ Yeni Sohbet</button>
            </div>
        </div>

        <!-- ANA İÇERİK -->
        <div class="main-content">
            <header class="header" style="display:flex; align-items:center; justify-content:space-between; padding:8px 16px; border-bottom:1px solid var(--border); background:var(--bg-secondary); flex-shrink:0;">
                <button id="menuToggle" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text); padding:4px 8px;">☰</button>

                <div class="header-center-mobile-fix" style="display:flex; align-items:center; gap:8px; flex:1; justify-content:center;">
                    <span class="page-title" style="display:none;">💬 Sohbet</span>
                    <div class="version-box" style="display:flex; align-items:center; gap:4px;">
                        <span class="label-text" style="font-size:0.7rem; font-weight:600; color:var(--text-light);">Versiyon</span>
                        <span id="versionDisplay" style="font-size:0.8rem; font-weight:600; color:var(--primary);">ChatChip 1.0</span>
                    </div>
                    <div class="coach-box" style="display:flex; align-items:center; gap:4px; border-left:1px solid var(--border); padding-left:8px;">
                        <span class="label-text" style="font-size:0.7rem; font-weight:600; color:var(--text-light);">Koç</span>
                        <select id="coachSelector" style="padding:4px 10px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:0.75rem; cursor:pointer; outline:none;">
                            <option value="standard" selected>Normal</option>
                            <option value="mlm">MLM Koçu</option>
                            <option value="akademi">Akademik Koç</option>
                            <option value="kisisel">Kişisel Koç</option>
                        </select>
                    </div>
                </div>

                <button id="profileToggle" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text); padding:4px 8px;">👤</button>
            </header>

            <div id="planWarning" style="display:none; background:#FEF3C7; padding:8px 16px; text-align:center; font-size:0.8rem; color:#92400E; border-bottom:1px solid #F59E0B;">
                ⚠️ <strong>Planınız sona erdi!</strong> <a href="/pricing.html" style="color:#d97706; text-decoration:underline;">Hemen plan satın alın</a>
            </div>

            <main class="chat-area" id="chatArea">
                <div class="welcome">
                    <h2 id="welcomeMessage">Merhaba! 👋</h2>
                    <p>Bugün sana nasıl yardımcı olabilirim?</p>
                </div>
                <div id="messages"></div>
            </main>

            <footer class="input-area">
            <div class="input-wrapper">
    <!-- Gizli dosya input'u (iOS uyumlu) -->
<input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp" style="position: absolute; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0;" />

<!-- Dosya Yükle Butonu (iOS uyumlu) -->
<button type="button" class="icon-btn icon-left-1" id="fileUploadBtn" title="Dosya Yükle" onclick="document.getElementById('fileInput').click()" style="cursor:pointer;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
</button>

    <button class="icon-btn icon-left-2" id="speechBtn" title="Sesli Komut">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
    </button>

    <!-- Textarea -->
    <textarea id="messageInput" rows="1" placeholder="Mesajını yaz..."></textarea>

    <!-- Görsel Önizleme Alanı -->
    <div id="filePreviewContainer" style="display:none; position:absolute; right:100px; bottom:10px; z-index:10;">
        <img id="filePreviewImg" alt="Önizleme" style="width:40px; height:40px; border-radius:8px; border:1px solid var(--border); object-fit:cover;"/>
    </div>

    <button id="sendBtn" title="Gönder">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
    </button>
    <button id="stopBtn" title="Yanıtı Durdur" style="display:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="6" width="12" height="12" rx="1"/>
        </svg>
    </button>
</div>
            </footer>
        </div>

        <!-- SAĞ PROFİL -->
        <div class="sidebar-right" id="sidebarRight">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="/assets/logo.svg" alt="ChatChip" width="28" height="28">
                    <span>Hesap</span>
                </div>
                <button class="close-sidebar" onclick="toggleSidebar('right')">✕</button>
            </div>

            <div class="profile-section" id="profileSection">
                <div class="profile-avatar" id="profileAvatar">👤</div>
                <div class="profile-name" id="profileName">Misafir</div>
                <div class="profile-email" id="profileEmail">giris@yapilmadi</div>
                <div class="profile-plan" id="profilePlan">
                    <span class="plan-label">📋 Plan</span>
                    <span class="plan-name" id="planName">🆓 Ücretsiz</span>
                    <span class="plan-time" id="planTime">24 saat kaldı</span>
                    <div id="planExpiresContainer" style="margin-top:4px; font-size:0.6rem; color:var(--text-light);">🗓️ <span id="planExpires">Yükleniyor...</span></div>
                </div>
            </div>

            <div class="login-form" id="loginForm">
                <input type="email" id="loginEmail" class="form-input" placeholder="E-posta adresiniz">
                <input type="password" id="loginPassword" class="form-input" placeholder="Şifreniz">
                <button class="login-btn" id="loginBtn">🔑 Giriş Yap</button>
                <div style="text-align:center; margin-top:10px;">
                    <a href="/forgot-password.html" style="color:var(--text-light); font-size:0.75rem; text-decoration:none;">🔑 Şifremi Unuttum</a>
                    <span style="color:var(--text-light); font-size:0.75rem; margin:0 6px;">|</span>
                    <a href="/register?position=left" style="color:var(--primary); font-size:0.75rem; text-decoration:none;">Kayıt ol</a>
                </div>
            </div>

            <div class="user-menu" id="userMenu" style="display:none;">
                <!-- 🔐 BİYOMETRİK BUTONLAR (YENİ KONUM - PROFİL MENÜSÜ) -->
                <div id="biometricButtons" style="display:flex; flex-direction:column; gap:6px; margin:8px 0;">
                    <button id="biometricLoginBtn" style="display:none; width:100%; padding:10px; border:none; border-radius:8px; background:linear-gradient(135deg, #7BD3C9, #5FB8A0); color:white; font-size:0.85rem; font-weight:600; cursor:pointer;">
                        🔐 Face ID / Parmak İzi ile Giriş
                    </button>
                    <button id="biometricRegisterBtn" style="display:none; width:100%; padding:10px; border:none; border-radius:8px; background:linear-gradient(135deg, #8B5CF6, #6D28D9); color:white; font-size:0.85rem; font-weight:600; cursor:pointer;">
                        📱 Face ID / Parmak İzi Kaydet
                    </button>
                </div>

                <button class="menu-item" onclick="window.location.href='/backoffice.html'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg> Backoffice
                </button>
                <button class="menu-item" onclick="window.location.href='/cuzdan.html'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8h-4M4 12V8h-2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H4z"/><path d="M16 4l-4 4-4-4"/></svg> Cüzdan
                </button>
                <button class="menu-item" onclick="window.location.href='/tree-detail.html'">🌳 Ağaç</button>
                <button class="menu-item" onclick="window.location.href='/pricing.html'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg> Plan Yükselt
                </button>
                <button class="menu-item admin" id="adminMenuItem" style="display:none;" onclick="window.location.href='/admin-panel.html'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4M12 16h.01"/></svg> Admin Panel
                </button>
                <div style="margin:8px 0;">
                    <button class="menu-item theme-toggle" onclick="toggleDarkMode()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg> Tema Değiştir
                    </button>
                </div>
                <button class="menu-item logout" id="logoutBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Oturumu Kapat
                </button>
            </div>
        </div>

        <div class="overlay" id="overlay" onclick="closeAllSidebars()"></div>
    </div>

    <script src="/js/crypto.js"></script>
    <script src="/js/datamanager.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('menuToggle').addEventListener('click', function() { toggleSidebar('left'); });
            document.getElementById('profileToggle').addEventListener('click', function() { toggleSidebar('right'); });
        });
    </script>
</body>
</html>
