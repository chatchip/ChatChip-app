<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatChip - Admin Panel</title>
    <meta name="theme-color" content="#7BD3C9">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin-panel.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">
                <img src="/assets/logo.svg" alt="ChatChip" width="32" height="32">
                <span>ChatChip</span>
            </div>
            <div class="header-actions">
                <a href="/backoffice.html" class="nav-btn">← Backoffice</a>
                <a href="/index.html" class="nav-btn">💬 Sohbet</a>
                <button class="btn-profile" id="profileBtn">👤</button>
            </div>
        </header>

        <main class="admin-content" id="adminContent">
            <div class="loading">⏳ Yükleniyor...</div>
        </main>
    </div>

    <script src="/js/datamanager.js"></script>
    <script>
        (function checkAuth() {
            const token = localStorage.getItem('chatchip_token');
            const user = JSON.parse(localStorage.getItem('chatchip_user') || 'null');
            
            if (!token || !user) {
                window.location.href = '/index.html';
                return;
            }
            
            if (!user.is_admin) {
                alert('❌ Bu sayfaya erişim yetkiniz yok!');
                window.location.href = '/index.html';
                return;
            }
        })();
    </script>
    <script src="/js/admin-panel.js"></script>
</body>
</html>
