<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Şifre - ChatChip</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .reset-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
        }
        .reset-container h2 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.5rem;
            color: var(--text);
        }
        .reset-container p {
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
            position: relative;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text);
        }
        .form-input {
            width: 100%;
            padding: 10px 14px;
            padding-right: 45px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: var(--bg);
            color: var(--text);
            transition: border 0.2s;
            box-sizing: border-box;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            bottom: 10px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: all 0.2s;
            color: var(--text-light);
            user-select: none;
        }
        .toggle-password:hover {
            background: rgba(0,0,0,0.05);
            color: var(--text);
        }
        .toggle-password:active {
            transform: scale(0.9);
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            display: none;
        }
        .message.success {
            display: block;
            background: #D5F5E3;
            color: #1E8449;
            border: 1px solid #82E0AA;
        }
        .message.error {
            display: block;
            background: #FADBD8;
            color: #922B21;
            border: 1px solid #F1948A;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: var(--text-light);
            font-size: 0.8rem;
            text-decoration: none;
        }
        .back-link:hover {
            color: var(--text);
        }
        .password-rules {
            margin-top: 6px;
            font-size: 0.65rem;
            color: var(--text-light);
            line-height: 1.6;
        }
        .password-rules div {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .password-rules .icon {
            font-size: 0.7rem;
        }
        .password-rules .met {
            color: #10B981;
        }
        .password-rules .unmet {
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <h2>🔐 Yeni Şifre Oluştur</h2>
        <p>Yeni şifrenizi girin.</p>

        <div id="message" class="message"></div>

        <form id="resetForm">
            <div class="form-group">
                <label>Yeni Şifre</label>
                <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required minlength="12">
                <button type="button" class="toggle-password" id="togglePassword" aria-label="Şifreyi göster/gizle">
                    👁️
                </button>
            </div>

            <!-- Şifre kuralları -->
            <div class="password-rules">
                <div id="passRuleLength">
                    <span class="icon" id="passLengthIcon">⬜</span> En az 12 karakter
                </div>
                <div id="passRuleUpper">
                    <span class="icon" id="passUpperIcon">⬜</span> En az 1 büyük harf
                </div>
                <div id="passRuleLower">
                    <span class="icon" id="passLowerIcon">⬜</span> En az 1 küçük harf
                </div>
                <div id="passRuleSpecial">
                    <span class="icon" id="passSpecialIcon">⬜</span> En az 1 özel karakter (!@#$%^&*)
                </div>
            </div>

            <div class="form-group" style="margin-top: 12px;">
                <label>Şifre Tekrar</label>
                <input type="password" id="passwordConfirmInput" class="form-input" placeholder="••••••••" required minlength="12">
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">🔓 Şifreyi Sıfırla</button>
        </form>

        <a href="/index.html" class="back-link">← Giriş sayfasına dön</a>
    </div>

    <script src="/js/datamanager.js"></script>
    <script>
        // ============================================================
        // 🔥 URL'DEN TOKEN'İ AL
        // ============================================================
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('message').textContent = '❌ Geçersiz veya eksik token!';
            document.getElementById('message').className = 'message error';
            document.getElementById('message').style.display = 'block';
            document.getElementById('resetForm').style.display = 'none';
        }

        // ============================================================
        // 🔥 ŞİFRE GÖSTER/GİZLE
        // ============================================================
        (function setupPasswordToggle() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('passwordInput');

            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function() {
                    const isPassword = passwordInput.type === 'password';
                    passwordInput.type = isPassword ? 'text' : 'password';
                    this.textContent = isPassword ? '🙈' : '👁️';
                    this.setAttribute('aria-label', isPassword ? 'Şifreyi gizle' : 'Şifreyi göster');
                });
            }
        })();

        // ============================================================
        // 🔥 ŞİFRE KURAL KONTROLÜ
        // ============================================================
        function checkPasswordStrength(password) {
            const rules = {
                length: password.length >= 12,
                upper: /[A-Z]/.test(password),
                lower: /[a-z]/.test(password),
                special: /[!@#$%^&*(),.?":{}|<>]/.test(password)
            };
            return rules;
        }

        function updatePasswordUI(password) {
            const rules = checkPasswordStrength(password);

            document.getElementById('passLengthIcon').textContent = rules.length ? '✅' : '⬜';
            document.getElementById('passRuleLength').className = rules.length ? 'met' : 'unmet';

            document.getElementById('passUpperIcon').textContent = rules.upper ? '✅' : '⬜';
            document.getElementById('passRuleUpper').className = rules.upper ? 'met' : 'unmet';

            document.getElementById('passLowerIcon').textContent = rules.lower ? '✅' : '⬜';
            document.getElementById('passRuleLower').className = rules.lower ? 'met' : 'unmet';

            document.getElementById('passSpecialIcon').textContent = rules.special ? '✅' : '⬜';
            document.getElementById('passRuleSpecial').className = rules.special ? 'met' : 'unmet';

            return rules;
        }

        // ============================================================
        // 🔥 ŞİFRE İNPUT CANLI KONTROL
        // ============================================================
        document.getElementById('passwordInput').addEventListener('input', function() {
            updatePasswordUI(this.value);
        });

        // ============================================================
        // 🔥 FORM SUBMIT
        // ============================================================
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const password = document.getElementById('passwordInput').value;
            const confirm = document.getElementById('passwordConfirmInput').value;
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');
            
            // 🔥 Şifre kurallarını kontrol et
            const rules = checkPasswordStrength(password);
            
            if (!rules.length) {
                showMessage('❌ Şifre en az 12 karakter olmalı!', 'error');
                return;
            }
            if (!rules.upper) {
                showMessage('❌ Şifre en az 1 BÜYÜK harf içermeli!', 'error');
                return;
            }
            if (!rules.lower) {
                showMessage('❌ Şifre en az 1 küçük harf içermeli!', 'error');
                return;
            }
            if (!rules.special) {
                showMessage('❌ Şifre en az 1 özel karakter (!@#$%^&*) içermeli!', 'error');
                return;
            }

            if (password !== confirm) {
                showMessage('❌ Şifreler eşleşmiyor!', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ İşleniyor...';
            msg.style.display = 'none';

            try {
                const dm = window.DataManager;
                const result = await dm.resetPassword(token, password);
                
                if (result.success) {
                    showMessage('✅ ' + result.message + ' Yönlendiriliyorsunuz...', 'success');
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 2000);
                } else {
                    showMessage('❌ ' + (result.error || 'Bir hata oluştu.'), 'error');
                }
            } catch (error) {
                showMessage('❌ ' + error.message, 'error');
            }

            btn.disabled = false;
            btn.textContent = '🔓 Şifreyi Sıfırla';
        });

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
        }

        // ============================================================
        // 🔥 ŞİFRE KONTROLÜNÜ BAŞLAT (İlk durum)
        // ============================================================
        updatePasswordUI('');
    </script>
</body>
</html>
